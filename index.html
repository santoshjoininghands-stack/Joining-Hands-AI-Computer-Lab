<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Joining Hands — AI Computer Learning & Practical Lab</title>
<style>
:root{--blue:#1f4788;--bg:#f4f6fb;--ink:#182238;--muted:#667085;--card:#fff;--green:#0c9b75}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--blue);color:white;padding:18px 24px;position:sticky;top:0;z-index:5}
header b{font-size:22px;display:block}header span{font-size:16px}
main{max-width:900px;margin:auto;padding:22px 16px 60px}.nav{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px}
button{border:0;border-radius:12px;background:var(--blue);color:white;padding:14px 18px;font-size:16px;cursor:pointer}
button.secondary{background:white;color:var(--blue);border:1px solid #ccd5e5}
button.green{background:var(--green)}.card{background:white;border-radius:20px;padding:22px;margin:16px 0;box-shadow:0 5px 22px #18223812}
h1{font-size:32px;margin:8px 0 16px}h2{font-size:24px;margin-top:6px}h3{margin-bottom:8px}
.muted{color:var(--muted)}.badge{display:inline-block;padding:6px 10px;border-radius:20px;background:#e8f8f3;color:#08785d;font-size:13px}
.lesson{display:flex;justify-content:space-between;gap:16px;align-items:center;border:1px solid #e2e7ef;border-radius:14px;padding:16px;margin:10px 0}
.lesson strong{display:block}.lesson small{color:var(--muted)}
.project-img{width:100%;display:block;border:1px solid #ddd;border-radius:12px;background:white;margin:14px 0}
.step{display:flex;gap:12px;margin:12px 0;padding:12px;border-left:4px solid var(--blue);background:#f7f9fd;border-radius:8px}
.num{font-weight:bold;color:var(--blue);min-width:26px}.actions{display:flex;gap:10px;flex-wrap:wrap}
input{width:100%;padding:15px;border:1px solid #ccd5e5;border-radius:10px;font-size:16px;margin:8px 0}
.login{max-width:460px;margin:70px auto}.error{color:#b42318;margin:12px 0}
@media(max-width:600px){main{padding:16px 12px}.nav{grid-template-columns:1fr 1fr}.lesson{align-items:flex-start;flex-direction:column}.lesson button{width:100%}}
</style>
</head>
<body>
<header><b>JOINING HANDS</b><span>AI Computer Learning & Practical Lab</span></header>
<main id="app"></main>
<script>
const state={user:null,curriculum:null};
const app=document.getElementById('app');

async function api(path,opts={}){
  const r=await fetch(path,{headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});
  const text=await r.text(); let data={}; try{data=JSON.parse(text)}catch{}
  if(!r.ok) throw new Error(data.error||'Request failed');
  return data;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function login(){
 app.innerHTML=`<div class="card login">
   <h1>🔐 Login</h1>
   <input id="code" placeholder="Student / Teacher / Admin ID" autocomplete="username">
   <input id="pass" type="password" placeholder="Password" autocomplete="current-password">
   <button onclick="doLogin()">Login</button>
   <div id="err"></div>
   <p class="muted">Student: JH2026-001 / 1234<br>Teacher: JH-T-001 / teacher123<br>Admin: JH-A-001 / admin123</p>
 </div>`;
}
async function doLogin(){
 const err=document.getElementById('err');err.className='error';err.textContent='';
 try{
   const x=await api('/api/login',{method:'POST',body:JSON.stringify({user_code:document.getElementById('code').value.trim(),password:document.getElementById('pass').value})});
   state.user=x.user; await loadCurriculum(); dashboard();
 }catch(e){err.textContent=e.message.includes('Failed')?'Unable to connect to the server. Please try again.':e.message}
}
async function loadCurriculum(){state.curriculum=await (await fetch('/curriculum.json')).json()}
function nav(){
 return `<div class="nav">
 <button onclick="dashboard()">🏠 Dashboard</button>
 <button onclick="courses()">📚 Courses</button>
 <button onclick="simple('Attendance','/api/attendance')">🗓️ Attendance</button>
 <button onclick="profile()">👤 Profile</button>
 <button onclick="simple('Certificates','/api/certificates')">🏆 Certificates</button>
 <button onclick="location.reload()">Logout</button></div>`;
}
function dashboard(){
 app.innerHTML=nav()+`<div class="card"><h1>Welcome, ${esc(state.user?.name||'Student')} 👋</h1>
 <p>Learn → Practice → Pass → Earn your certificate.</p></div>
 ${state.curriculum.courses.map(c=>courseCard(c)).join('')}`;
}
function courseCard(c){
 return `<div class="card"><h2>${esc(c.title)}</h2><p class="muted">${esc(c.description)}</p>
 <p><b>${c.lessons.length}</b> practical lessons available.</p>
 <button onclick="courses()">Open Course</button></div>`;
}
function courses(){
 app.innerHTML=nav()+`<div class="card"><h1>📚 Courses</h1>
 ${state.curriculum.courses.map(c=>`<h2>${esc(c.title)}</h2>${c.lessons.map((l,i)=>`
 <div class="lesson"><div><strong>${i+1}. ${esc(l.title)}</strong><small>${esc(l.project)} • ${esc(l.duration)}</small></div>
 <button onclick="lesson('${l.id}')">Open</button></div>`).join('')}`).join('')}</div>`;
}
function findLesson(id){
 return state.curriculum.courses.flatMap(c=>c.lessons).find(l=>l.id===id);
}
function lesson(id){
 const l=findLesson(id);
 app.innerHTML=nav()+`<div class="card">
 <span class="badge">${esc(l.project)} • ${esc(l.duration)}</span>
 <h1>${esc(l.title)}</h1>
 <p class="muted">First see the exact curriculum project. Then learn how to recreate it step by step.</p>
 <img class="project-img" src="${l.image}" alt="${esc(l.title)} sample">
 <h2>🎯 What you will learn</h2>
 <ul>${l.learn.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
 <h2>👨‍💻 How to make this project</h2>
 ${l.steps.map((x,i)=>`<div class="step"><div class="num">${i+1}</div><div>${esc(x)}</div></div>`).join('')}
 <h2>📝 Practical</h2>
 <div class="card" style="background:#f7f9fd;margin:0 0 16px"><b>Your Task</b><p>${esc(l.practical)}</p></div>
 <div class="actions">
   <button class="green" onclick="complete('${l.id}')">✅ I Completed the Practical</button>
   <button class="secondary" onclick="courses()">← Back to Lessons</button>
 </div>
 <p id="status" class="muted"></p>
 </div>`;
}
async function complete(id){
 const s=document.getElementById('status');
 try{
   const l=findLesson(id);
   // Score 100 records a passed practical in the existing backend.
   await api('/api/lesson-attempt',{method:'POST',body:JSON.stringify({lessonId:id,score:100})});
   s.textContent='Practical completed and progress updated.';
 }catch(e){s.textContent='Could not save progress: '+e.message}
}
async function profile(){
 try{
  const p=await api('/api/me');
  app.innerHTML=nav()+`<div class="card"><h1>👤 Profile</h1>
  <p><b>Name:</b> ${esc(p.name)}</p><p><b>User ID:</b> ${esc(p.user_code)}</p>
  <p><b>Role:</b> ${esc(p.role)}</p><p><b>Batch:</b> ${esc(p.batch)}</p></div>`;
 }catch(e){app.innerHTML=nav()+`<div class="card"><p class="error">${esc(e.message)}</p></div>`}
}
async function simple(title,url){
 try{
  const d=await api(url); app.innerHTML=nav()+`<div class="card"><h1>${esc(title)}</h1><pre style="white-space:pre-wrap">${esc(JSON.stringify(d,null,2))}</pre></div>`;
 }catch(e){app.innerHTML=nav()+`<div class="card"><h1>${esc(title)}</h1><p class="error">${esc(e.message)}</p></div>`}
}
(async()=>{try{await loadCurriculum(); login()}catch(e){app.innerHTML='<div class="card"><h1>Unable to load curriculum</h1></div>'}})();
</script>
</body>
</html>
