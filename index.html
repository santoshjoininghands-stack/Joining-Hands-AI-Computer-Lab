<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Joining Hands — AI Computer Learning & Practical Lab</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="site-header">
  <div class="brand">
    <div class="brand-title">JOINING HANDS</div>
    <div class="brand-subtitle">AI Computer Learning & Practical Lab</div>
  </div>
</header>

<main class="container">
  <section id="homeView">
    <div class="hero">
      <h1>Learn. Practice. Improve.</h1>
      <p>Learn computer skills through real projects and practical exercises.</p>
    </div>
    <h2>Courses</h2>
    <div id="courseGrid" class="grid"></div>
  </section>

  <section id="courseView" class="hidden">
    <button class="back" onclick="showHome()">← All Courses</button>
    <div id="courseHeader"></div>
    <div id="lessonGrid" class="lesson-grid"></div>
  </section>

  <section id="lessonView" class="hidden">
    <button class="back" onclick="backToCourse()">← Back to Lessons</button>
    <div id="lessonContent"></div>
  </section>
</main>

<footer>Joining Hands • AI Computer Learning & Practical Lab</footer>
<script src="/app.js"></script>
</body>
</html>
