<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Joining Hands AI Computer Lab</title><style>
body{margin:0;font-family:Arial;background:#f5f7fb;color:#172033}header{background:#173b7a;color:#fff;padding:18px 24px}main{max-width:1100px;margin:auto;padding:20px}
button{border:0;border-radius:9px;padding:11px 15px;background:#173b7a;color:#fff;cursor:pointer;margin:3px}.nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 3px 14px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.page{display:none}.page.active{display:block}
.lesson{border:1px solid #e4e8ef;padding:16px;border-radius:12px;margin:10px 0}.tag{display:inline-block;background:#eef3ff;color:#315fb5;border-radius:20px;padding:4px 8px;font-size:12px}
input,select{width:100%;padding:11px;box-sizing:border-box;border:1px solid #d8deea;border-radius:9px;margin:8px 0}.good{color:green}.warn{color:#a15c00}.score{font-size:38px;font-weight:700}
table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #eee;text-align:left}.profile{max-width:600px}.pill{padding:5px 9px;border-radius:15px;background:#eef3ff}
</style></head><body><header><b>JOINING HANDS</b><br><small>AI Computer Learning & Practical Lab</small></header><main>
<section id="login" class="page active"><div class="card" style="max-width:420px;margin:40px auto"><h1>🔐 Login</h1><input id="code" placeholder="User ID"><input id="pw" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="err"></p><small>Student: JH2026-001 / 1234<br>Teacher: JH-T-001 / teacher123<br>Admin: JH-A-001 / admin123</small></div></section>
<section id="app" class="page"><div class="nav" id="nav"></div><div id="content"></div></section></main>
<script>
let token='',me=null,curr=null,prog={};
async function api(p,o={}){o.headers=o.headers||{};o.headers.Authorization='Bearer '+token;return fetch(p,o)}
async function login(){let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:code.value.trim(),password:pw.value})}),d=await r.json();if(!r.ok){err.textContent=d.error;return}token=d.token;me=d.user;curr=await(await api('/api/curriculum')).json();await load();login.classList.remove('active');app.classList.add('active');nav.innerHTML=me.role==='student'?'<button onclick="home()">🏠 Dashboard</button><button onclick="courses()">📚 Courses</button><button onclick="attendance()">🗓 Attendance</button><button onclick="profile()">👤 Profile</button><button onclick="certs()">🏆 Certificates</button><button onclick="logout()">Logout</button>':'<button onclick="teacher()">👨‍🏫 Dashboard</button><button onclick="markAttendance()">🗓 Attendance</button>'+(me.role==='admin'?'<button onclick="addStudent()">➕ Add Student</button>':'')+'<button onclick="logout()">Logout</button>';me.role==='student'?home():teacher()}
async function load(){prog={};(await(await api('/api/progress')).json()).forEach(x=>prog[x.lesson_id]=x)}
async function home(){let st=await(await api('/api/course-status')).json();content.innerHTML=`<div class="card"><h1>Welcome, ${me.name} 👋</h1><p>Learn → Practice → Pass → Earn your certificate.</p></div><div class="grid">${st.map(x=>`<div class="card"><h3>${x.title}</h3><p>${x.completed}/${x.total} lessons passed</p><p>Average: <b>${x.average}%</b></p><button onclick="course('${x.id}')">Open</button>${x.complete?`<button onclick="certificate('${x.id}')">🏆 Certificate</button>`:''}</div>`).join('')}</div>`}
function courses(){home()}
function course(id){let c=curr.courses.find(x=>x.id===id);content.innerHTML=`<div class="card"><h2>${c.title}</h2>${c.lessons.map(l=>{let p=prog[l.id];return `<div class="lesson"><h3>${l.title}</h3>${p?`<p class="${p.best_score>=70?'good':'warn'}">Best: ${p.best_score}% • Attempts: ${p.attempts}</p>`:''}<button onclick="lesson('${id}','${l.id}')">Open</button></div>`}).join('')}</div>`}
function lesson(cid,lid){let c=curr.courses.find(x=>x.id===cid),l=c.lessons.find(x=>x.id===lid),q=l.quiz||[];content.innerHTML=`<div class="card"><h2>${l.title}</h2><p>${l.explain||''}</p><h3>Step-by-step</h3>${(l.steps||[]).map((s,i)=>`<p><b>${i+1}.</b> ${s}</p>`).join('')}${l.practice?`<div class="lesson"><b>Practice:</b> ${l.practice}</div>`:''}${q.length?'<h3>Quiz</h3>'+q.map((x,i)=>`<p><b>${x.q}</b><br>${x.options.map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${o}</label><br>`).join('')}</p>`).join(''):''}<button onclick="submitLesson('${cid}','${lid}')">Submit</button><button onclick="ai('${lid}')">🤖 Ask AI</button><p id="msg"></p></div>`}
async function submitLesson(cid,lid){let l=curr.courses.find(x=>x.id===cid).lessons.find(x=>x.id===lid),q=l.quiz||[],score=100;if(q.length){let ok=0;q.forEach((x,i)=>{let a=document.querySelector('input[name=q'+i+']:checked');if(a&&+a.value===x.answer)ok++});score=Math.round(ok/q.length*100)}let d=await(await api('/api/lesson-attempt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lessonId:lid,score})})).json();await load();msg.innerHTML=d.passed?`<span class="good">✅ ${score}/100 — Passed!</span>`:`<span class="warn">📚 ${score}/100 — Practice again.</span>`}
function ai(lid){content.innerHTML=`<div class="card"><h2>🤖 AI Teacher</h2><div id="chat"></div><input id="q" placeholder="Ask about this lesson"><button onclick="ask('${lid}')">Ask</button></div>`}
async function ask(lid){let v=q.value;chat.innerHTML+=`<p><b>You:</b> ${v}</p><p id="a">Thinking...</p>`;let d=await(await api('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:v,lessonId:lid})})).json();a.textContent=d.answer||d.error;q.value=''}
async function attendance(){let d=await(await api('/api/attendance')).json();content.innerHTML=`<div class="card"><h2>🗓 My Attendance</h2><div class="grid"><div><h2>${d.percentage}%</h2><p>Attendance</p></div><div><h2>${d.present}</h2><p>Present</p></div><div><h2>${d.absent}</h2><p>Absent</p></div></div><table><tr><th>Date</th><th>Status</th></tr>${d.rows.map(x=>`<tr><td>${x.date}</td><td>${x.status}</td></tr>`).join('')}</table></div>`}
async function profile(){content.innerHTML=`<div class="card profile"><h2>👤 My Profile</h2><input id="pname" value="${me.name||''}" placeholder="Name"><input id="phone" value="${me.phone||''}" placeholder="Phone"><input id="email" value="${me.email||''}" placeholder="Email"><p>User ID: <b>${me.user_code}</b></p><button onclick="saveProfile()">Save Profile</button><p id="pm"></p></div>`}
async function saveProfile(){let d=await(await api('/api/me',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:pname.value,phone:phone.value,email:email.value})})).json();me=d;pm.innerHTML='<span class="good">Saved.</span>'}
async function certs(){let d=await(await api('/api/certificates')).json();content.innerHTML='<div class="card"><h2>🏆 Certificates</h2>'+(d.length?d.map(x=>`<div class="lesson"><b>${x.course_id}</b><br>${x.certificate_no}<br><button onclick="certificate('${x.course_id}')">View</button></div>`).join(''):'Complete a course to earn a certificate.')+'</div>'}
async function certificate(id){let d=await(await api('/api/certificate/'+id,{method:'POST'})).json();if(d.error){alert(d.error);return}let c=curr.courses.find(x=>x.id===id);content.innerHTML=`<div class="card"><div style="border:7px double #173b7a;padding:35px;text-align:center"><h1>🏆 CERTIFICATE OF COMPLETION</h1><p>This certifies that</p><h2>${me.name}</h2><p>has successfully completed</p><h2>${c.title}</h2><p>Joining Hands AI Computer Learning Programme</p><small>Certificate No: ${d.certificate_no}<br>Issued: ${new Date(d.issued_at).toLocaleDateString()}</small></div><button onclick="window.print()">🖨 Print / Save PDF</button></div>`}
async function teacher(){let d=await(await api('/api/teacher-summary')).json();content.innerHTML='<div class="card"><h2>👨‍🏫 Teacher Dashboard</h2>'+d.map(s=>`<div class="lesson"><b>${s.student.name}</b> (${s.student.user_code})<br>${s.courses.map(c=>`${c.title}: ${c.completed}/${c.total}, avg ${c.average}%`).join('<br>')}<br>Attendance: <b>${s.attendance.percentage}%</b></div>`).join('')+'</div>'}
async function markAttendance(){let d=await(await api('/api/students')).json();let today=new Date().toISOString().slice(0,10);content.innerHTML=`<div class="card"><h2>🗓 Mark Attendance</h2><input id="adate" type="date" value="${today}"><table>${d.map(s=>`<tr><td>${s.name} (${s.user_code})</td><td><button onclick="mark(${s.id},'present')">Present</button><button onclick="mark(${s.id},'absent')">Absent</button></td></tr>`).join('')}</table><p id="am"></p></div>`}
async function mark(uid,status){let d=await(await api('/api/attendance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:uid,date:adate.value,status})})).json();am.innerHTML=d.ok?'<span class="good">Attendance saved.</span>':''}
async function addStudent(){content.innerHTML=`<div class="card profile"><h2>➕ Add Student</h2><input id="sid" placeholder="Student ID e.g. JH2026-002"><input id="sn" placeholder="Student name"><input id="sb" placeholder="Batch"><input id="sp" placeholder="Temporary password" value="1234"><input id="sphone" placeholder="Phone"><input id="semail" placeholder="Email"><button onclick="createStudent()">Create Student</button><p id="sm"></p></div>`}
async function createStudent(){let d=await(await api('/api/students',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_code:sid.value,name:sn.value,batch:sb.value,password:sp.value,phone:sphone.value,email:semail.value})})).json();sm.textContent=d.error||'Student created successfully.'}
function logout(){location.reload()}
</script></body></html>
