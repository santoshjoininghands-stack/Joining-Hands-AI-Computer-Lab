services:
  - type: web
    name: joining-hands-ai-computer-lab
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATA_DIR
        value: /var/data
      - key: OPENAI_API_KEY
        sync: false
    disk:
      name: joining-hands-data
      mountPath: /var/data
      sizeGB: 1
